profile:
  target_titles:
  - Staff Software Engineer
  industries:
  - Financial Services
  - Payments, Fintech
  - SaaS
  - Site Reliability Engineer
  - Enterprise Software
  - optionally Security/Identity
  required_skills:
  - Python
  - Docker
  preferred_skills:
  - Kafka
  - JMS
  - MongoDB
  - Oracle
  - Jenkins
  - API Gateway
  - Splunk
  - Prometheus
  - Grafana
  - PostgreSQL
  - Oracle
  - OAuth2
  - JWT
  - BDD
  - TDD
  - incident management
  - payments
  - PCI compliance
  - PII compliance
  - SOX compliance
  - identity
  - KYC
  - application security
  - observability
  - high-volume distributed systems
  years_experience: 8
  locations:
  - All Remote jobs
  - Bay Area
  - SanFrancisco
  - Texas
  - Virginia
  work_modes:
  - remote
  - hybrid
  - on-site
  salary_min: 130000
  salary_max: 180000
  salary_currency: USD
  employment_types:
  - full-time
  - contract
  - part time
  work_authorization: U.S. Citizen
  excluded_companies: []
  excluded_titles:
  - intern
  - unpaid
  excluded_skills: []
  excluded_locations: []
  master_resume_path: C:\Users\Admin\Desktop\Jobs Applied\master_resume.docx
  master_resumes: {}
  cover_letter_template_path: null
match_weights:
  required_skills: 30
  preferred_skills: 20
  title_similarity: 15
  experience_alignment: 10
  location_work_mode: 15
  salary_compatibility: 10
application_statuses:
- Imported
- Analyzed
- Resume draft ready
- Awaiting review
- Approved
- Saved
- Reviewing
- Ready to apply
- Applied
- Interviewing
- Rejected
- Offer
- Withdrawn
- Archived
duplicate:
  title_similarity_threshold: 0.88
  content_similarity_threshold: 0.9
